# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=6563
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configurations
# 256-bit key base64 encoded: "SmartAttendanceManagementSystemSecretKey2026Secure256Bit" in hex/base64
# We will use a secure string that exceeds 256 bits.
attendance.jwt.secret=9a4f2c8d3b7a1e5f8c6b2a0d9e8f7a6b5c4d3e2f1a0b9d8c7e6f5a4b3c2d1e0f
attendance.jwt.expiration-ms=86400000

# Geofencing Configuration (Default: Office Coordinates in tech hubs)
# Default Coordinates (Bangalore Tech Hub)
attendance.geofence.latitude=12.971598
attendance.geofence.longitude=77.594562
attendance.geofence.radius-meters=100.0

# File Upload Configuration for facial images
attendance.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger UI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
