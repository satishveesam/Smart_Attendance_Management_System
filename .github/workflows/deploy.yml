name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Change this to your default branch name if it is different (e.g., master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 1. Build Spring Boot Backend
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: maven

    - name: Build Backend JAR
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    # 2. Build Vite/React Frontend
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build Frontend Assets
      run: |
        cd frontend
        npm install
        npm run build

    # 3. Deploy to EC2 Server
    - name: Copy Files to EC2 via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        source: "backend/target/*.jar,frontend/dist/*"
        target: "/home/ubuntu/temp-deploy"
        rm: true

    - name: Install Deployments and Restart Services on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # 1. Deploy backend JAR
          mv /home/ubuntu/temp-deploy/backend/target/*.jar /home/ubuntu/app.jar

          # 2. Deploy frontend static assets
          sudo rm -rf /var/www/attendance/*
          sudo cp -r /home/ubuntu/temp-deploy/frontend/dist/* /var/www/attendance/

          # 3. Cleanup temp directory
          rm -rf /home/ubuntu/temp-deploy

          # 4. Restart backend Spring Boot service
          sudo systemctl restart attendance
